[buildPlans.IosevkaCode]
family = "Iosevka Code"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

  [buildPlans.IosevkaCode.variants]
  inherits = "ss14"

    [buildPlans.IosevkaCode.variants.design]
    one = "base"
    two = "curly-neck-serifless"
	three = "two-arcs"
	four = "semi-open-non-crossing-serifless"
	six = "closed-contour"
	seven = "straight-serifless"
    zero = "long-dotted"
    capital-i = "serifed"
	capital-w = "straight-vertical-sides-serifless"
	a = "double-storey-serifless"
    e = "flat-crossbar"
    f = "serifless"
    g = "single-storey-serifless"
    i = "semi-tailed"
	l = "semi-tailed"
    t = "flat-hook"
	w = "straight-serifless"
	m = "short-leg-serifless"
	n = "earless-rounded-straight-serifless"
    ampersand = "closed"
	paren = "flat-arc"
    at = "fourfold"
	percent = "rings-segmented-slash"
    question = "smooth"
    lig-ltgteq = "flat"
    lig-equal-chain = "with-notch"
    lig-hyphen-chain = "with-notch"
    lig-plus-chain = "with-notch"
    lig-double-arrow-bar = "with-notch"
    lig-single-arrow-bar = "with-notch"

    [buildPlans.IosevkaCode.variants.italic]
    one = "no-base"
    a = "double-storey-serifless"
    asterisk = "turn-penta-low"

  [buildPlans.IosevkaCode.ligations]
  inherits = "clike"
  enable = [
	  "arrow",
	  "eqeqeq",
	  "lteq", "gteq",
	  "dcolon",
  ]

[buildPlans.IosevkaCode.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaCode.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.IosevkaCode.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaCode.widths.Normal]
shape = 620
menu = 5
css = "normal"


[buildPlans.IosevkaCode.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaCode.slopes.Italic]
angle = 12
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaCode.metricOverride]
leading = 1200
